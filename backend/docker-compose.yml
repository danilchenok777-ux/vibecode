services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-godhead}
      POSTGRES_USER: ${POSTGRES_USER:-godhead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - godhead_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-godhead} -d ${POSTGRES_DB:-godhead}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${GODHEAD_S3_ACCESS_KEY:-godhead-dev-access}
      MINIO_ROOT_PASSWORD: ${GODHEAD_S3_SECRET_KEY:?Set GODHEAD_S3_SECRET_KEY in backend/.env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - godhead_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set godhead http://minio:9000 "${GODHEAD_S3_ACCESS_KEY:-godhead-dev-access}" "${GODHEAD_S3_SECRET_KEY}" &&
      until mc ready godhead; do sleep 2; done &&
      mc mb --ignore-existing "godhead/${GODHEAD_S3_BUCKET:-godhead-media}"
    environment:
      MINIO_ROOT_USER: ${GODHEAD_S3_ACCESS_KEY:-godhead-dev-access}
      MINIO_ROOT_PASSWORD: ${GODHEAD_S3_SECRET_KEY:?Set GODHEAD_S3_SECRET_KEY in backend/.env}
      GODHEAD_S3_BUCKET: ${GODHEAD_S3_BUCKET:-godhead-media}
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GODHEAD_ENV: production
      GODHEAD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-godhead}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-godhead}
      GODHEAD_S3_ENDPOINT_URL: http://minio:9000
      GODHEAD_ATTACHMENT_STORAGE_BACKEND: s3
      GODHEAD_S3_PUBLIC_ENDPOINT_URL: ${GODHEAD_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      GODHEAD_S3_REGION: ${GODHEAD_S3_REGION:-us-east-1}
      GODHEAD_S3_BUCKET: ${GODHEAD_S3_BUCKET:-godhead-media}
      GODHEAD_S3_ACCESS_KEY: ${GODHEAD_S3_ACCESS_KEY:-godhead-dev-access}
      GODHEAD_S3_SECRET_KEY: ${GODHEAD_S3_SECRET_KEY:?Set GODHEAD_S3_SECRET_KEY in backend/.env}
      GODHEAD_S3_PRESIGN_TTL_SECONDS: ${GODHEAD_S3_PRESIGN_TTL_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  godhead_postgres_data:
  godhead_minio_data:
