name: GODHEAD Android compile verification

on:
  push:
    branches: [main]
    paths:
      - "TMessagesProj/**"
      - "TMessagesProj_Modules/**"
      - "baselineprofile/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - ".gitmodules"
      - ".github/workflows/android-compile.yml"
  pull_request:
    paths:
      - "TMessagesProj/**"
      - "TMessagesProj_Modules/**"
      - "baselineprofile/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - ".gitmodules"
      - ".github/workflows/android-compile.yml"

permissions:
  contents: read

concurrency:
  group: godhead-android-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize pinned upstream submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          if ! git submodule status --recursive | awk '$1 ~ /^[-+U]/ && $2 !~ /\/test262$/ { print; bad=1 } END { exit bad }'; then
            echo "::error::A required pinned submodule is missing or mismatched."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || {
            echo "::error::Android SDK command-line tools are missing on this runner."
            exit 1
          }

      - name: Accept Android SDK licenses and install pinned build tools
        run: |
          yes | sdkmanager --licenses
          # Android 17 / API 37 is distributed as a preview package named android-37.0.
          sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          # Some AGP versions still resolve compileSdk 37 from platforms/android-37.
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/ninja"

      - name: Install CMake 4.x required by ExteraGram native build
        run: |
          CMAKE_ARCHIVE="$RUNNER_TEMP/cmake-4.5.1-linux-x86_64.tar.gz"
          CMAKE_ROOT="$RUNNER_TEMP/cmake-4.5.1-linux-x86_64"
          curl --fail --location --silent --show-error \
            "https://github.com/Kitware/CMake/releases/download/v4.5.1/cmake-4.5.1-linux-x86_64.tar.gz" \
            --output "$CMAKE_ARCHIVE"
          echo "83b71181fb62b4fe8f26067a9321448572e7a43bd04ff6c7f54a24c33698f16d  $CMAKE_ARCHIVE" | sha256sum --check
          tar -xzf "$CMAKE_ARCHIVE" -C "$RUNNER_TEMP"
          test -x "$CMAKE_ROOT/bin/cmake"
          "$CMAKE_ROOT/bin/cmake" --version
          # Gradle uses this external CMake root; Ninja is supplied by the SDK package.
          printf 'cmake.dir=%s\\n' "$CMAKE_ROOT" >> local.properties
          echo "$CMAKE_ROOT/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure non-production compile-only keys
        run: |
          {
            printf 'APP_ID=12345\n'
            printf 'APP_HASH="0123456789abcdef0123456789abcdef"\n'
            printf 'MAPS_V2_API="AIzaSyGODHEAD_COMPILE_ONLY_NOT_A_REAL_KEY"\n'
          } > API_KEYS

          mkdir -p TMessagesProj
          cat > TMessagesProj/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "godhead-compile-validation",
              "storage_bucket": "godhead-compile-validation.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.godhead.messenger"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyGODHEAD_COMPILE_ONLY_NOT_A_REAL_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Compile GODHEAD full ARM64 debug variant
        env:
          JAVA_TOOL_OPTIONS: -Xmx5g
        run: |
          chmod +x ./gradlew
          # Maven Central occasionally responds with HTTP 429 when many CI jobs
          # resolve the same Kotlin/Android dependency graph concurrently.
          for attempt in 1 2 3 4 5; do
            set +e
            ./gradlew --no-daemon --max-workers=2 --refresh-dependencies \
              -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
              :TMessagesProj:assembleFullArm64Debug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
            result=${PIPESTATUS[0]}
            set -e
            if [[ "$result" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -Eqi 'HTTP 429|status code 429|Too Many Requests|status code 5[0-9][0-9]' "$RUNNER_TEMP/gradle-build.log"; then
              exit "$result"
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Dependency repositories kept rate-limiting the Android build after five attempts."
              exit "$result"
            fi
            delay=$((attempt * 25))
            echo "::warning::Dependency repository rate limit detected; retrying Gradle after ${delay}s (attempt $((attempt + 1))/5)."
            sleep "$delay"
          done
