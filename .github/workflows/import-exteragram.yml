name: Import ExteraGram base

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GODHEAD bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve importer workflow
        run: |
          mkdir -p /tmp/godhead-bootstrap/.github/workflows
          cp .github/workflows/import-exteragram.yml /tmp/godhead-bootstrap/.github/workflows/

      - name: Import upstream source and submodule references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          git clone --recurse-submodules --shallow-submodules https://github.com/exteraSquad/exteraGram.git /tmp/exteragram
          cd /tmp/exteragram
          git remote add godhead "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git push godhead HEAD:main --force

      - name: Apply GODHEAD repository identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          cd /tmp/exteragram
          mkdir -p .github/workflows
          cp /tmp/godhead-bootstrap/.github/workflows/import-exteragram.yml .github/workflows/
          cat > README.md <<'EOF'
          # GODHEAD

          GODHEAD is an Android client project based on the ExteraGram codebase.

          ## Upstream and licensing

          - Upstream: https://github.com/exteraSquad/exteraGram
          - License: GNU GPL v3 or later, with upstream additional terms.
          - Keep all upstream copyright and license notices. The application must retain the required “Based on ExteraGram” attribution and upstream link in its About/legal information.

          ## Build

          Read the upstream build instructions in this repository before building. The project requires its Git submodules, Android SDK/NDK, and locally supplied API/signing configuration. Never commit API credentials, keystores, or passwords.

          ## Roadmap

          1. Import and verify the upstream Android project.
          2. Establish a reproducible GODHEAD debug APK build.
          3. Apply GODHEAD branding and package identity while preserving required notices.
          4. Design and implement GODHEAD-owned backend services. Telegram-dependent networking and account flows remain upstream until deliberately replaced and tested.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/import-exteragram.yml
          git commit -m "chore: establish GODHEAD project identity"
          git push godhead HEAD:main
